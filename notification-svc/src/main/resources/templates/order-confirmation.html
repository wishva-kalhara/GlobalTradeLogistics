<h2 style="margin:0 0 12px;color:#111827;">Order confirmed</h2>
<p>Hi {{recipientName}},</p>
<p>Thanks for your order. Here are the details:</p>
<table role="presentation" width="100%" cellpadding="8" style="border-collapse:collapse;margin-top:12px;">
    <tr>
        <td style="border-bottom:1px solid #e5e7eb;color:#6b7280;">Order ID</td>
        <td style="border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold;">#{{orderId}}</td>
    </tr>
    <tr>
        <td style="color:#6b7280;">Total</td>
        <td style="text-align:right;font-weight:bold;">${{total}}</td>
    </tr>
</table>
