services:
  db:
    image: postgres:16
    container_name: gtl-db
    restart: unless-stopped
    env_file:
      - .desired-state/db.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./.no-build/db/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./.no-build/db/02-auth.postgres.sql:/docker-entrypoint-initdb.d/02-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .desired-state/db.env
      - .desired-state/app.env
    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"

volumes:
  db-data:
