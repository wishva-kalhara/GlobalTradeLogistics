services:
  db:
    image: mysql:8
    container_name: gtl-db
    restart: unless-stopped
    env_file:
      - .desired-state/db.env
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # This is the only hand-written SQL in the stack: the 15-table legacy
      # SCM schema the assignment says we integrate with. Everything we
      # added ourselves (users, otp_codes, email-uniqueness constraints) is
      # schema-owned by Hibernate (hibernate.hbm2ddl.auto=update) instead —
      # see core's persistence.xml.
      - ./.no-build/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .desired-state/db.env
      - .desired-state/app.env
    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"

volumes:
  db-data:
