services:
  db:
    image: mysql:8
    container_name: gtl-db
    restart: unless-stopped
    env_file:
      - .desired-state/glassfish.conf
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # This is the only hand-written SQL in the stack: the 15-table legacy
      # SCM schema the assignment says we integrate with. Everything we
      # added ourselves (users, otp_codes, email-uniqueness constraints) is
      # schema-owned by Hibernate (hibernate.hbm2ddl.auto=update) instead —
      # see core's persistence.xml.
      - ./.no-build/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # DB credentials (needed by entrypoint.sh to build the JDBC pool's
      # connection properties) and GlassFish domain/resource config (ports,
      # pool naming/sizing, JMS resource names) — see .desired-state/glassfish.conf's
      # header for why those live in a file instead of here.
      - .desired-state/glassfish.conf
    environment:
      # Application runtime configuration — read directly by
      # core.configs.AppConfig, never by entrypoint.sh. Defined here (not a
      # .desired-state file) per this project's intended separation: GlassFish
      # setup vs. what the deployed app itself consumes.
      #
      # The four *_JNDI/*_CF_JNDI vars intentionally duplicate the same names
      # in .desired-state/glassfish.conf — entrypoint.sh creates those JMS
      # resources under those names, and the app looks them up under the
      # identical names at runtime. Keep both sides in sync if you rename one.
      JWT_SECRET: dev-only-change-me-globaltradelogistics-jwt-secret
      IS_PROD: "false"
      ADMIN_EMAIL: admin@globaltradelogistics.local
      ADMIN_FULL_NAME: System Administrator
      NOTIFICATION_TOPIC_CF_JNDI: jms/notification.email.send.factory
      NOTIFICATION_TOPIC_JNDI: jms/notification.email.send
      AUDIT_TOPIC_CF_JNDI: jms/monitoring.audit.log.factory
      AUDIT_TOPIC_JNDI: jms/monitoring.audit.log
      IDEMPOTENCY_QUEUE_CF_JNDI: jms/monitoring.idempotency.check.factory
      IDEMPOTENCY_QUEUE_JNDI: jms/monitoring.idempotency.check
      LOG_TOPIC_CF_JNDI: jms/monitoring.trace.log.factory
      LOG_TOPIC_JNDI: jms/monitoring.trace.log
      # SMTP account notification-svc sends templated HTML emails through
      # (core.configs.AppConfig#SMTP_*). Only exercised when IS_PROD=true —
      # fill these in with a real account before flipping that flag.
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_AUTH: "true"
      SMTP_EMAIL: ""
      SMTP_PASSWORD: ""
    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"

volumes:
  db-data:
