# Infra/deployment configuration for the GlassFish app container and its
# MySQL database — everything needed to build the image (tool versions),
# bootstrap the `db` service, and configure the GlassFish domain/JDBC-pool/
# JMS resources at container start. The application itself never reads any
# of these directly (see docker-compose.yml's app.environment block for the
# app's own runtime config — that's a deliberate separation, not an
# oversight).
#
# Consumers, by section below:
#   - Build-time tool versions: Dockerfile's build stage (`docker build`),
#     via `set -a && . glassfish.conf && set +a` — done and gone before any
#     container ever starts.
#   - MySQL credentials: the `db` service natively (its own image's
#     entrypoint reads MYSQL_* to bootstrap the database/user), AND
#     .build-new/entrypoint.sh (to build the JDBC pool's connection
#     properties) — genuinely shared between two independent containers.
#   - GlassFish/JDBC-pool/JMS config: .build-new/entrypoint.sh only.
#
# The JMS *_JNDI/*_CF_JNDI names are the one intentional exception to "the
# app never reads these": entrypoint.sh needs them here to CREATE each
# resource, and the app needs the identical names in docker-compose.yml's
# environment block to LOOK THEM UP at runtime via core.configs.AppConfig.
# Duplicated on purpose — keep both sides in sync if you ever rename one.

# --- Build-time tool versions (Dockerfile build stage only) ---
GLASSFISH_VERSION=7.0.21
MYSQL_JDBC_VERSION=8.4.0

# --- MySQL credentials (the `db` service natively, and entrypoint.sh) ---
MYSQL_DATABASE=global_trade_log_corp
MYSQL_USER=gtl_app
MYSQL_PASSWORD=gtl_app
# Required by the mysql image (no default/empty root password) — only ever
# used for the container's own root account and its healthcheck, never by
# the app itself (the app connects as MYSQL_USER, not root).
MYSQL_ROOT_PASSWORD=gtl_root

# --- GlassFish HTTP/HTTPS listener ports (entrypoint.sh) ---
# Admin console listener stays on GlassFish's own default, 4848 — nothing to
# configure there.
HTTP_PORT=8080
HTTPS_PORT=8181
ADMIN_PORT=4848

# --- Where the JDBC connection pool points (entrypoint.sh) ---
# The `db` service's hostname/port on the compose network.
DB_HOST=db
DB_PORT=3306

# --- JDBC pool + resource naming and sizing (entrypoint.sh) ---
# JNDI_NAME must match the <jta-data-source> hardcoded in core's
# persistence.xml. Pool sizes kept small for a single-instance dev MySQL
# container — raise for real concurrent load.
JNDI_NAME=jdbc/globalTradeLogisticsDS
POOL_NAME=globalTradeLogisticsPool
DB_POOL_MIN_SIZE=2
DB_POOL_MAX_SIZE=32
DB_POOL_MAX_WAIT_MS=10000

# --- JMS resources for the notification topic (entrypoint.sh) ---
# Consumed by notification-svc (Phase 5) — created idempotently by
# entrypoint.sh. JNDI names follow the <service>.<resource>.<action>
# convention: notification-svc's email resource's send action.
NOTIFICATION_TOPIC_CF_JNDI=jms/notification.email.send.factory
NOTIFICATION_TOPIC_JNDI=jms/notification.email.send

# --- JMS resources for the audit-log Topic and idempotency-check Queue ---
# Consumed by monitoring-svc (Phase 6) — created idempotently by
# entrypoint.sh, same naming convention as the notification topic above.
AUDIT_TOPIC_CF_JNDI=jms/monitoring.audit.log.factory
AUDIT_TOPIC_JNDI=jms/monitoring.audit.log
IDEMPOTENCY_QUEUE_CF_JNDI=jms/monitoring.idempotency.check.factory
IDEMPOTENCY_QUEUE_JNDI=jms/monitoring.idempotency.check
